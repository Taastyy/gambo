<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roulette - Premium Casino</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="roulette.css">
</head>
<body>
    <div class="app-container">
        <!-- Top Bar -->
        <header class="top-nav">
            <a href="index.html" class="nav-btn">← Menü</a>
            <button id="btn-stats" class="nav-btn">📊 Statistik</button>
            <div class="brand">Roulette</div>
            <div class="stats-panel">
                <div class="stat-pill">
                    <span class="stat-label">Balance</span>
                    <span class="stat-value gold balance-display" id="balance">0</span>
                </div>
                <div class="stat-pill">
                    <span class="stat-label">Einsatz</span>
                    <span class="stat-value" id="current-bet">0</span>
                </div>
            </div>
        </header>

        <!-- Main Layout -->
        <main class="game-area">
            <!-- Left Panel: Wheel & History -->
            <section class="wheel-panel">
                <div class="wheel-stage">
                    <div class="wheel-container" id="wheel-container">
                        <canvas id="wheel-canvas" width="320" height="320"></canvas>
                        <div class="wheel-pointer"></div>

                        <div class="wheel-center">
                            <span id="winning-number" class="winning-display">?</span>
                        </div>
                    </div>
                </div>

                <div class="history-container">
                    <div class="history-title">Letzte Zahlen</div>
                    <div class="history-list" id="history-list"></div>
                </div>
                
                <div class="toast-message" id="toast-message">Platziere deinen Einsatz!</div>
            </section>

            <!-- Right Panel: Board & Controls -->
            <section class="board-panel">
                <div class="board-wrapper">
                    <div class="roulette-board" id="roulette-board">
                        <div class="zero-zone">
                            <div class="board-cell num-0 green-cell" data-bet="num-0">0</div>
                        </div>
                        <div class="main-grid-wrapper">
                            <div class="number-row top-row" id="row-3"></div>
                            <div class="number-row mid-row" id="row-2"></div>
                            <div class="number-row bot-row" id="row-1"></div>
                        </div>
                        <div class="col-zone">
                            <div class="board-cell col-bet" data-bet="col-3">2:1</div>
                            <div class="board-cell col-bet" data-bet="col-2">2:1</div>
                            <div class="board-cell col-bet" data-bet="col-1">2:1</div>
                        </div>
                    </div>
                    
                    <div class="dozens-row">
                        <div class="board-cell empty-left"></div>
                        <div class="board-cell dozen-bet" data-bet="dozen-1">1st 12</div>
                        <div class="board-cell dozen-bet" data-bet="dozen-2">2nd 12</div>
                        <div class="board-cell dozen-bet" data-bet="dozen-3">3rd 12</div>
                        <div class="board-cell empty-right"></div>
                    </div>

                    <div class="outside-row">
                        <div class="board-cell empty-left"></div>
                        <div class="board-cell outside-bet" data-bet="low">1-18</div>
                        <div class="board-cell outside-bet" data-bet="even">EVEN</div>
                        <div class="board-cell outside-bet red-cell" data-bet="red">ROT</div>
                        <div class="board-cell outside-bet black-cell" data-bet="black">SCHWARZ</div>
                        <div class="board-cell outside-bet" data-bet="odd">ODD</div>
                        <div class="board-cell outside-bet" data-bet="high">19-36</div>
                        <div class="board-cell empty-right"></div>
                    </div>
                </div>

                <div class="controls-panel">
                    <div class="chips-selector" id="chips-selector">
                        <button class="chip-btn" data-value="1">1</button>
                        <button class="chip-btn" data-value="5">5</button>
                        <button class="chip-btn active" data-value="10">10</button>
                        <button class="chip-btn" data-value="25">25</button>
                        <button class="chip-btn" data-value="100">100</button>
                        <button class="chip-btn" data-value="500">500</button>
                    </div>
                    <div class="action-buttons">
                        <button class="action-btn secondary" id="btn-clear" title="Alle löschen">✕</button>
                        <button class="action-btn secondary" id="btn-undo" title="Rückgängig">↩</button>
                        <button class="action-btn primary" id="btn-spin">SPIN</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Statistics Modal -->
    <div id="stats-modal-overlay" class="modal-overlay hidden">
        <div class="modal-dialog">
            <div class="modal-header">
                <h2>📊 Statistik</h2>
                <button id="close-stats-btn" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-box-label">Spiele</div>
                        <div class="stat-box-value" id="stat-games">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-box-label">Gewonnen</div>
                        <div class="stat-box-value gold" id="stat-won-amount">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-box-label">Verloren</div>
                        <div class="stat-box-value red" id="stat-lost-amount">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-box-label">Profit</div>
                        <div class="stat-box-value" id="stat-profit">0</div>
                    </div>
                </div>
                <div class="modal-actions">
                    <button class="action-btn secondary" id="btn-reset-balance">Balance & Stats Zurücksetzen</button>
                </div>
            </div>
        </div>
    </div>

    <script src="balance.js"></script>
    <script src="roulette.js"></script>
</body>
</html>
