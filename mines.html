<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mines - Premium Casino</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="mines.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar / Controls -->
        <aside class="sidebar">
            <div class="brand">
                <a href="index.html" class="back-link">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </a>
                <h1>MINES</h1>
            </div>

            <div class="balance-container">
                <span class="label">Balance</span>
                <div class="balance-value">€<span id="balance">1000.00</span></div>
            </div>

            <div class="controls-section">
                <!-- Bet Amount -->
                <div class="control-group">
                    <div class="control-header">
                        <label>Einsatzbetrag</label>
                        <span id="current-bet-display">€100.00</span>
                    </div>
                    <div class="number-input">
                        <input type="number" id="bet-input" value="100" min="1" step="1" onchange="setCustomBet(this.value)">
                        <div class="input-actions">
                            <button onclick="halfBet()">½</button>
                            <button onclick="doubleBet()">2×</button>
                            <button onclick="setAllIn()">Max</button>
                        </div>
                    </div>
                </div>

                <!-- Mines Count -->
                <div class="control-group">
                    <div class="control-header">
                        <label>Anzahl der Minen</label>
                        <span id="mines-count-display">5</span>
                    </div>
                    <select id="mines-count" class="custom-select">
                        <option value="3">3 Minen</option>
                        <option value="5" selected>5 Minen</option>
                        <option value="10">10 Minen</option>
                        <option value="15">15 Minen</option>
                        <option value="20">20 Minen</option>
                    </select>
                </div>
            </div>

            <!-- Hint Button (Replaces probability toggle) -->
            <button id="hint-btn" class="btn-secondary" onclick="showHints()" disabled>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
                Tipp: 3 Felder analysieren
            </button>

            <!-- Main Action Button -->
            <button id="main-action-btn" class="btn-primary" onclick="handleMainAction()">
                Spielen
            </button>
        </aside>

        <!-- Main Game Area -->
        <main class="game-area">
            <!-- Game Status Bar -->
            <div class="status-bar">
                <div class="multiplier-box">
                    <span class="label">Multiplikator</span>
                    <span id="current-multiplier" class="value">1.00×</span>
                </div>
                <div class="potential-win-box">
                    <span class="label">Möglicher Gewinn</span>
                    <span id="potential-win-amount" class="value text-success">€100.00</span>
                </div>
            </div>

            <!-- Grid Container -->
            <div class="grid-container">
                <div id="game-message" class="game-message hidden"></div>
                <div id="mines-grid" class="mines-grid">
                    <!-- Grid generated by JS -->
                </div>
            </div>

            <!-- Stats & History -->
            <div class="bottom-tools">
                <button class="tool-btn" onclick="showStatsModal()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10"></path><path d="M12 20V4"></path><path d="M6 20v-4"></path></svg>
                    Statistiken
                </button>
            </div>
            
            <div class="history-container">
                <div class="history-list" id="history-list"></div>
            </div>
        </main>

        <!-- Statistics Modal -->
        <div id="stats-modal-overlay" class="modal-overlay hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Statistiken</h2>
                    <button class="close-btn" onclick="closeStatsModal()">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="stats-grid">
                        <div class="stat-box">
                            <span class="stat-label">Gespielt</span>
                            <span id="stats-total-games" class="stat-val">0</span>
                        </div>
                        <div class="stat-box">
                            <span class="stat-label">Gewonnen</span>
                            <span id="stats-wins" class="stat-val text-success">0</span>
                        </div>
                        <div class="stat-box">
                            <span class="stat-label">Höchster Gewinn</span>
                            <span id="stats-highest-win" class="stat-val text-success">€0</span>
                        </div>
                        <div class="stat-box">
                            <span class="stat-label">Verloren</span>
                            <span id="stats-losses" class="stat-val text-danger">0</span>
                        </div>
                        <div class="stat-box" style="grid-column: 1 / -1;">
                            <span class="stat-label">Aktuelle Balance</span>
                            <span class="stat-val text-success">€<span id="stats-balance">1000.00</span></span>
                        </div>
                    </div>
                    <button class="btn-secondary mt-15 text-danger" onclick="resetStats()">Statistiken & Balance Zurücksetzen</button>
                </div>
            </div>
        </div>
    </div>

    <script src="balance.js"></script>
    <script src="mines.js"></script>
</body>
</html>
