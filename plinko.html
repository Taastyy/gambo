<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLINKO</title>
    <link rel="stylesheet" href="plinko.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Orbitron:wght@700;900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="noise-overlay"></div>

    <a href="index.html" class="back-btn" id="back-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6" />
        </svg>
        Menü
    </a>

    <div class="app" id="app">
        <aside class="panel">
            <header class="panel-header">
                <div class="brand">
                    <div class="brand-icon">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />
                            <circle cx="12" cy="8" r="2.5" fill="currentColor" />
                            <path d="M8 20 L12 12 L16 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </div>
                    <h1 class="brand-name">PLINKO</h1>
                </div>
            </header>

            <div class="wallet">
                <span class="wallet-label">Guthaben</span>
                <div class="wallet-amount" id="balance-display">
                    <span class="wallet-currency">$</span><span id="balance">1000</span>
                </div>
            </div>

            <div class="field">
                <label class="field-label">Einsatz</label>
                <div class="bet-input-row">
                    <button class="btn-icon" onclick="adjBet(-50)" aria-label="Weniger">−</button>
                    <input type="number" id="bet-input" value="100" min="1" onchange="setBet(this.value)">
                    <button class="btn-icon" onclick="adjBet(50)" aria-label="Mehr">+</button>
                </div>
                <div class="bet-presets">
                    <button onclick="halfBet()">½×</button>
                    <button onclick="dblBet()">2×</button>
                    <button onclick="maxBet()">MAX</button>
                </div>
            </div>

            <div class="field">
                <label class="field-label">Risiko</label>
                <div class="risk-row">
                    <button class="risk-btn" data-risk="low" onclick="setRisk('low')">Low</button>
                    <button class="risk-btn active" data-risk="medium" onclick="setRisk('medium')">Mid</button>
                    <button class="risk-btn" data-risk="high" onclick="setRisk('high')">High</button>
                </div>
            </div>

            <div class="field">
                <label class="field-label">Reihen</label>
                <div class="rows-row">
                    <button class="rows-btn" data-rows="8" onclick="setRows(8)">8</button>
                    <button class="rows-btn" data-rows="12" onclick="setRows(12)">12</button>
                    <button class="rows-btn active" data-rows="16" onclick="setRows(16)">16</button>
                </div>
            </div>

            <button class="btn-drop" id="drop-btn" onclick="dropBall()">
                <span class="btn-drop-circle"></span>
                DROP
                <kbd>Space</kbd>
            </button>

            <label class="auto-toggle">
                <input type="checkbox" id="auto-check" onchange="toggleAuto()">
                <span class="auto-slider"></span>
                <span class="auto-label">Auto-Drop</span>
            </label>

            <div class="result-card" id="result-card">
                <span class="result-card-label">LETZTER GEWINN</span>
                <span class="result-card-value" id="result-value">—</span>
            </div>

            <div class="tracker">
                <div class="tracker-row"><span>Spiele</span><span id="stat-games">0</span></div>
                <div class="tracker-row"><span>Gewonnen</span><span id="stat-wins">0</span></div>
                <div class="tracker-row"><span>Profit</span><span id="stat-profit">0</span></div>
            </div>
        </aside>

        <main class="stage">
            <canvas id="plinkoCanvas"></canvas>
            <div class="tape" id="history-bar"></div>
        </main>
    </div>

    <div id="stats-modal-overlay" class="modal-overlay" style="display:none">
        <span id="stats-balance" style="display:none">1000</span>
    </div>

    <script src="balance.js"></script>
    <script src="plinko.js"></script>
    <script>
        setTimeout(function () {
            if (typeof syncBalance === 'function') syncBalance();
            if (typeof getBalanceSync === 'function') {
                var b = getBalanceSync();
                var el = document.getElementById('balance');
                if (el) el.textContent = Math.round(b);
            }
        }, 50);
    </script>
</body>

</html>
